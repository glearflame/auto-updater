    package_name: "eslint"
    check_installed: false

  # ==========================================
  # Docker Hub (container images)
  # ==========================================
  - name: "nginx"
    type: "dockerhub"
    repository: "library/nginx"
    check_installed: false

  - name: "postgres"
    type: "dockerhub"
    repository: "library/postgres"
    check_installed: false

  - name: "redis"
    type: "dockerhub"
    repository: "library/redis"
