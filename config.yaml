  # ==========================================
  # PyPI (Python packages)
  # ==========================================
  - name: "requests"
    type: "pypi"
    package_name: "requests"
    check_installed: false

  - name: "flask"
    type: "pypi"
    package_name: "flask"
    check_installed: false

  - name: "django"
    type: "pypi"
