    check_installed: false

  - name: "alpine"
    type: "dockerhub"
    repository: "library/alpine"
    check_installed: false

  # ==========================================
  # AUR (Arch Linux User Repository)
  # ==========================================
  - name: "yay"
    type: "arch"
    package_name: "yay"
    check_installed: false

  - name: "google-chrome"
    type: "arch"
    package_name: "google-chrome"
    check_installed: false

# Configurações gerais
settings:
  # Repositório onde será feito o commit das atualizações
  update_repo_owner: "glearflame"
  update_repo_name: "auto-updater-releases"
  
  # Diretório onde os arquivos de versão serão salvos
  versions_dir: "versions"
  
  # Diretório para logs
  logs_dir: "logs"
  
  # Preparar post para Reddit automaticamente?
  prepare_reddit_post: true
  
  # Fazer commit e push automaticamente?
  auto_push: true
  
  # Criar tag no GitHub para cada versão nova?
  create_github_tag: true
